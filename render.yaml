# Render Blueprint for the ETHGlobal demo.
# Dashboard: New → Blueprint → pick this repo. See DEPLOY.md.
services:
  - type: web
    name: fathom
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fathom-db
          property: connectionString
      - key: SEED_DEMO
        value: "true"
      # Next.js standalone binds HOSTNAME. Render's default hostname is not 0.0.0.0.
      - key: HOSTNAME
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      - key: INDEX_BLOCK_RANGE
        value: "80"
      - key: INDEX_MAX_LOGS
        value: "100"
      - key: INDEX_CHUNK_SIZE
        value: "15"
      - key: ETH_RPC_URL
        value: https://ethereum-rpc.publicnode.com
      - key: ARBITRUM_RPC_URL
        value: https://arbitrum-one-rpc.publicnode.com
      - key: BASE_RPC_URL
        value: https://base-rpc.publicnode.com

databases:
  - name: fathom-db
    plan: free
    databaseName: fathom
    user: fathom
